name: Publish APK Release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release asset
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "WeverseTranslator-v${VERSION}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v${VERSION}"
          ASSET="WeverseTranslator-v${VERSION}.apk"
          NOTES="Android APK for Weverse DM Korean → Simplified Chinese translation. Uses ChatGPT plan authorization, artist-side Korean context, AccessibilityService text extraction, conservative proper-name handling, and local translation caching. No OCR and no screen capture."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Weverse Translator $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "Weverse Translator $TAG" \
              --notes "$NOTES"
          fi
