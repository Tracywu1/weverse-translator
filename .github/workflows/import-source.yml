name: Import v0.4.0 source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import remaining v0.4.0 files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/Tracywu1/demos1/weverse-translator-apk-build/weverse-plus"

          mkdir -p app/src/main/java/com/cc/weversetranslator
          mkdir -p app/src/main/res/layout app/src/main/res/values app/src/main/res/xml

          curl -fsSL "$BASE/app/src/main/java/com/cc/weversetranslator/OpenAiAuth.kt" -o app/src/main/java/com/cc/weversetranslator/OpenAiAuth.kt
          curl -fsSL "$BASE/app/src/main/java/com/cc/weversetranslator/OverlayController.kt" -o app/src/main/java/com/cc/weversetranslator/OverlayController.kt
          curl -fsSL "$BASE/app/src/main/java/com/cc/weversetranslator/TranslationClient.kt" -o app/src/main/java/com/cc/weversetranslator/TranslationClient.kt
          curl -fsSL "$BASE/app/src/main/java/com/cc/weversetranslator/WeverseAccessibilityService.kt" -o app/src/main/java/com/cc/weversetranslator/WeverseAccessibilityService.kt
          curl -fsSL "$BASE/app/src/main/res/layout/activity_main.xml" -o app/src/main/res/layout/activity_main.xml
          curl -fsSL "$BASE/app/src/main/res/values/strings.xml" -o app/src/main/res/values/strings.xml
          curl -fsSL "$BASE/app/src/main/res/xml/accessibility_service_config.xml" -o app/src/main/res/xml/accessibility_service_config.xml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "Source already up to date."
          else
            git commit -m "Complete v0.4.0 standalone source migration"
            git pull --rebase origin main
            git push origin main
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Android build
        run: gradle :app:assembleDebug --stacktrace
